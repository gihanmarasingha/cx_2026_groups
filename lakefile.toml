name = "cx_2026_groups"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Cx2026Groups"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Cx2026Groups"

[[require]]
name = "verso"
git = "https://github.com/tdupu/verso.git"
# Lean 4.35.0 backport of upstream #1043; see project_maintenance.md.
rev = "6c1b93307c6637ab5d0ae1cd9560a7e55fd6680f"
